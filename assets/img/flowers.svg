<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="奶油色房间里的一瓶花">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9dfcb"/>
      <stop offset="1" stop-color="#d6c8b1"/>
    </linearGradient>
    <linearGradient id="tableF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b99a7c"/>
      <stop offset="1" stop-color="#8f715b"/>
    </linearGradient>
    <linearGradient id="vase" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8b79e"/>
      <stop offset=".45" stop-color="#efe6d5"/>
      <stop offset="1" stop-color="#b09b82"/>
    </linearGradient>
    <radialGradient id="lightF" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff7dc" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff5d9" stop-opacity="0"/>
    </radialGradient>
    <filter id="flBlur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="flGrain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="m"/>
      <feComponentTransfer in="m" result="g"><feFuncA type="linear" slope=".13"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="g" mode="soft-light"/>
    </filter>
  </defs>
