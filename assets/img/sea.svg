  </g>
  <path d="M541 798c36-4 68-1 93 5-30 8-64 10-93-5Z" fill="#3e2c30" opacity=".55"/>
  <rect width="1200" height="900" filter="url(#seaGrain)" fill="transparent"/>
</svg>
