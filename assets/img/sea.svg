  <g fill="#2b2026" opacity=".9">
    <path d="M535 706c-10 0-18 8-18 18 0 5 2 10 5 13l-3 16c-15 8-26 23-27 43l-1 47h26l6-45 8 45h46l4-45 11 45h25l-6-52c-2-20-13-33-30-40l-2-14c5-3 8-9 8-15 0-9-7-16-16-16-4 0-8 1-11 4l-4-3c-9-4-19 0-23 9Z"/>
