    <path d="M760 566h113l-22 7H777Z" fill="#ffd2a7" opacity=".45" filter="url(#seaBlur)"/>
    <path d="M790 604h70l-16 6h-40Z" fill="#ffd4ac" opacity=".4" filter="url(#seaBlur)"/>
  </g>
  <g fill="none" stroke="#f6d1b5" stroke-linecap="round">
    <path d="M0 596c92-10 173 1 248 15 85 16 146 9 217 1" stroke-opacity=".22" stroke-width="2"/>
    <path d="M452 640c108-11 201-6 289 8 102 17 213 16 459-2" stroke-opacity=".16" stroke-width="2"/>
    <path d="M0 681c151-15 286-3 407 16 134 21 275 9 407-3 147-13 266-3 386 14" stroke-opacity=".13" stroke-width="2"/>
    <path d="M0 736c138-10 262 2 370 17 129 18 240 8 356-5 172-20 326-10 474 16" stroke-opacity=".1" stroke-width="3"/>
  </g>
  <path d="M0 790c144-21 275-11 386 16 126 31 265 23 407-3 138-25 278-19 407 8v89H0Z" fill="url(#sand)"/>
