<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="海边落日与并肩看海的两个背影">
  <defs>
    <linearGradient id="seaSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9cfc4"/>
      <stop offset=".5" stop-color="#f2c4a9"/>
      <stop offset="1" stop-color="#dc9b8b"/>
    </linearGradient>
    <linearGradient id="seaWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b97d7a"/>
      <stop offset=".4" stop-color="#8f6671"/>
      <stop offset="1" stop-color="#493e4d"/>
    </linearGradient>
    <radialGradient id="seaSun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff9e9"/>
      <stop offset=".45" stop-color="#ffe5ba" stop-opacity=".8"/>
      <stop offset="1" stop-color="#f7c6a0" stop-opacity="0"/>
    </radialGradient>
    <filter id="seaBlur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="seaGrain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="m"/>
      <feComponentTransfer in="m" result="g"><feFuncA type="linear" slope=".14"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="g" mode="soft-light"/>
    </filter>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b07867"/>
      <stop offset="1" stop-color="#6c4a48"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#seaSky)"/>
  <ellipse cx="804" cy="426" rx="300" ry="230" fill="url(#seaSun)" filter="url(#seaBlur)"/>
  <circle cx="804" cy="412" r="74" fill="#fff0cf" opacity=".93"/>
  <g opacity=".35" fill="#c98a7d">
    <path d="M84 218c45-35 102-39 158-12 38-20 86-20 127-1 51-15 99-5 135 23-97 22-313 27-420-10Z" filter="url(#seaBlur)"/>
    <path d="M725 188c35-22 75-20 107 3 28-14 62-10 82 9-66 14-130 12-189-12Z" filter="url(#seaBlur)"/>
  </g>
  <g fill="none" stroke="#624049" stroke-width="2" stroke-linecap="round" opacity=".55">
    <path d="M302 187c9-6 18-6 26 0 9-6 18-6 27 0"/>
    <path d="M928 289c7-5 14-5 21 0 7-5 14-5 21 0"/>
  </g>
  <path d="M0 526c126-10 230-2 342 12 148 19 288 16 427-4 156-22 280-17 431 7v359H0Z" fill="url(#seaWater)"/>
  <g opacity=".7">
