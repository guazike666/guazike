<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-label="晨雾山野中的帐篷与远山">
  <defs>
    <linearGradient id="mtSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8d7c8"/>
      <stop offset=".48" stop-color="#c9c4ae"/>
      <stop offset="1" stop-color="#8c9889"/>
    </linearGradient>
    <linearGradient id="mtFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a9b8f"/>
      <stop offset="1" stop-color="#667a70"/>
    </linearGradient>
    <linearGradient id="mtMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#61776a"/>
      <stop offset="1" stop-color="#42594f"/>
    </linearGradient>
    <linearGradient id="mtNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b5148"/>
      <stop offset="1" stop-color="#263a33"/>
    </linearGradient>
    <radialGradient id="mtSun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6d6" stop-opacity=".85"/>
      <stop offset=".5" stop-color="#e9dcb2" stop-opacity=".3"/>
      <stop offset="1" stop-color="#dfd3ae" stop-opacity="0"/>
    </radialGradient>
    <filter id="mtBlur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="mtGrain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="m"/>
      <feComponentTransfer in="m" result="g"><feFuncA type="linear" slope=".15"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="g" mode="soft-light"/>
    </filter>
  </defs>
