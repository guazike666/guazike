  <defs>
    <linearGradient id="trSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe4df"/>
      <stop offset=".55" stop-color="#e8e2c9"/>
      <stop offset="1" stop-color="#cdd3ad"/>
    </linearGradient>
    <linearGradient id="trField" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fa276"/>
      <stop offset="1" stop-color="#526b52"/>
