<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1040" width="760" height="1040" role="img" aria-label="落日山野中并肩而立的两个身影">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8e4cd"/>
      <stop offset=".32" stop-color="#efc5b4"/>
      <stop offset=".62" stop-color="#d7958d"/>
      <stop offset=".82" stop-color="#a45f67"/>
      <stop offset="1" stop-color="#613c49"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff8e9" stop-opacity=".98"/>
      <stop offset=".45" stop-color="#ffe9c5" stop-opacity=".7"/>
      <stop offset="1" stop-color="#f7d2b1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillsFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b6266"/>
      <stop offset="1" stop-color="#744851"/>
    </linearGradient>
    <linearGradient id="hillsMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#68404a"/>
      <stop offset="1" stop-color="#473139"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d2a32"/>
      <stop offset="1" stop-color="#251c22"/>
    </linearGradient>
    <linearGradient id="tape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#f1ddc6" stop-opacity=".38"/>
      <stop offset="1" stop-color="#fffaf0" stop-opacity=".5"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="grain">
        <feFuncA type="linear" slope=".16"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="grain" mode="soft-light"/>
    </filter>
    <filter id="vignette" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <rect width="760" height="1040" fill="url(#sky)"/>
  <ellipse cx="478" cy="365" rx="265" ry="245" fill="url(#sun)" filter="url(#soft)"/>
  <circle cx="478" cy="365" r="86" fill="#ffeccb" opacity=".9"/>
  <circle cx="478" cy="365" r="102" fill="none" stroke="#fff3d8" stroke-opacity=".2" stroke-width="1"/>

  <g fill="none" stroke="#4d3038" stroke-width="1.6" stroke-linecap="round" opacity=".62">
