    <path d="M389 673h16l4 18c2 8 9 12 18 14 12 3 18 12 17 27l-4 58-10 86c-1 10-5 15-12 15-9 0-13-7-12-18l7-67-21-50-16 49 3 64c0 11-4 17-12 17-9 0-14-6-14-17l-2-77c0-15 3-26 10-34l16-18 4-22c3-3 6-6 8-10Z"/>
