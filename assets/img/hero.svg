    <path d="M404 739c-6 7-10 17-11 29l-2 34c0 7 2 10 6 10 4 0 6-4 7-10l5-33 5 32c1 6 3 9 7 9 4 0 6-4 5-11l-3-34c-1-12-5-21-11-27Z" opacity=".78"/>
  </g>
  <g fill="#1f171d">
    <path d="M374 661c-11 0-19 8-19 19 0 5 2 10 5 14-5 4-8 10-8 17 0 7 3 13 8 17l2 7c-2 3-3 7-3 11 0 9 6 16 15 17l34 1c10 0 17-7 17-17 0-8-5-14-12-16l-1-4c4-4 7-9 7-16 0-7-3-13-8-17 4-4 6-9 6-15 0-11-9-19-20-19-7 0-13 3-16 8-2-5-7-8-13-8-8 0-14 6-14 14 0 3 1 6 2 8Z" filter="url(#soft2)" opacity=".95"/>
  </g>

  <g fill="#1f171d">
